name: Dong goi Mam Mo Android va iOS
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Nen tang can build
        required: true
        default: both
        type: choice
        options: [both, android, ios]
      signed_iphone:
        description: Xuat IPA cho iPhone da dang ky (can 5 IOS Secrets)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build va kiem tra APK
        run: python3 Android/build_apk.py
      - uses: actions/upload-artifact@v7
        with:
          name: Mam-Mo-Android-APK
          path: |
            Android/Mam-Mo-Android-debug.apk
            Android/Mam-Mo-Android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
  ios_simulator:
    if: (inputs.platform == 'both' || inputs.platform == 'ios') && !inputs.signed_iphone
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build cho iPhone Simulator tren Mac
        run: sh iOS/build_ios.sh
      - name: Dong goi app simulator
        run: ditto -c -k --keepParent iOS/build/Build/Products/Debug-iphonesimulator/MamMo.app iOS/Mam-Mo-iOS-Simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Mam-Mo-iOS-Simulator-KHONG-CAI-TREN-IPHONE
          path: iOS/Mam-Mo-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
  ios_signed:
    if: (inputs.platform == 'both' || inputs.platform == 'ios') && inputs.signed_iphone
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Nap chu ky Apple
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: python3 ci/apple_signing.py
      - name: Archive va export IPA co chu ky
        run: python3 iOS/build_ipa.py --config "$RUNNER_TEMP/mammo-signing/signing.json" --profile "$RUNNER_TEMP/mammo-signing/profile.mobileprovision"
      - uses: actions/upload-artifact@v7
        with:
          name: Mam-Mo-iPhone-IPA
          path: |
            iOS/Mam-Mo-iPhone.ipa
            iOS/Mam-Mo-iPhone.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Xoa chu ky tam
        if: always()
        run: python3 ci/apple_signing.py --cleanup
